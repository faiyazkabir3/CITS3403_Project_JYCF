<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Main Menu</title>

  <!-- Silkscreen Font -->
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css_styles/main_menu.css" />
</head>
<body>

  <div class="menu-container">

    <!-- Top Bar -->
    <div class="top-bar">
      <img src="../assets/images/Shadows.gif" class="logo" alt="Game Logo">
      <div class="version">v0.1</div>
    </div>

    <!-- Main Content -->
    <div class="menu-content">

      <!-- Left: Leaderboard -->
      <div class="leaderboard">
        <h2>LEADERBOARD</h2>
        <ul>
          <li>#1 PlayerX - 1200</li>
          <li>#2 ZombieSlayer - 980</li>
          <li>#3 Survivor99 - 870</li>
          <li>#4 DeadShot - 820</li>
          <li>#5 NightRun - 760</li>
        </ul>
      </div>

      <!-- Right: Buttons -->
      <div class="menu-buttons">
        <button class="play-btn">PLAY GAME</button>
        <button>SETTINGS</button>
        <!-- <button>INVENTORY</button> -->
        <button>MISSIONS</button>
        <button>LOG OUT</button>
      </div>

    </div>
  </div>

</body>
</html>
