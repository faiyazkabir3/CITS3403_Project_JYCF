<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css_styles/mvp_style.css" />
</head>
<body>

  <div class="login-container">
    <h1>Welcome, Survivor</h1>
    <p class="subtitle">Access the safe zone</p>

    <form>
      <label for="username">Username or Email</label>
      <input type="text" id="username" placeholder="Enter username or email" />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" />

      <button type="submit" class="login-btn">Log In</button>

      <div class="secondary-buttons">
        <button type="button" class="signup-btn">New User Sign Up</button>
        <button type="button" class="guest-btn">Guest Login</button>
      </div>
    </form>
  </div>

</body>
</html>
