<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zombie Game Login MVP</title>

  <!-- CSS is now in the same folder -->
  <link rel="stylesheet" href="mvp_style.css" />
</head>
<body>

  <div class="login-container">
    <h1>Welcome, Survivor</h1>
    <p class="subtitle">Access the safe zone</p>

    <form>
      <label for="username">Username or Email</label>
      <input type="text" id="username" placeholder="Enter username or email" />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" />

      <button type="submit" class="login-btn">Log In</button>

      <div class="secondary-buttons">
        <button type="button" class="signup-btn">New User Sign Up</button>
        <button type="button" class="guest-btn">Guest Login</button>
      </div>
    </form>
  </div>

</body>
</html>
