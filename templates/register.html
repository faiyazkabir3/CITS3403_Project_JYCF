<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
</head>
<body class="auth-page register-page">
  <div class="login-container">
    <h1>Register</h1>
    <p class="subtitle">Create your account below.</p>

    {% if error %}
      <p class="subtitle">{{ error }}</p>
    {% endif %}

    <form id="register-form" method="POST" action="/register">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Choose a username" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create a password" />

      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" />

      <button type="submit" class="signup-btn">Register</button>
    </form>

    <div class="secondary-buttons">
      <button type="button" class="login-btn" onclick="window.location.href='/login'">Back to Login</button>

      <form method="POST" action="/guest-login" class="guest-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="guest-btn">Guest Login</button>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/register.js') }}" defer></script>
</body>
</html>
