<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Main Menu</title>

  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/main_menu.css" />
</head>
<body>

  <div class="menu-container">
    <div class="top-bar">
      <div style="display: flex; align-items: center; gap: 12px;">
        <img src="../static/images/Shadows.gif" class="logo" alt="Game Logo">
        <span style="color: white; font-family: 'Silkscreen', cursive;">Operator: {{ username }}</span>
      </div>
      <div class="version">v0.1</div>
    </div>

    <div class="menu-content">
      <div class="leaderboard">
        <h2>LEADERBOARD</h2>
        <ul>
          <li>#1 PlayerX - 1200</li>
          <li>#2 ZombieSlayer - 980</li>
          <li>#3 Survivor99 - 870</li>
          <li>#4 DeadShot - 820</li>
          <li>#5 NightRun - 760</li>
        </ul>
      </div>

      <div class="menu-buttons">
        <button onclick="window.location.href='/play'">PLAY GAME</button>
        <button type="button">SETTINGS</button>
        <button onclick="window.location.href='/achievements'">ACHIEVEMENTS</button>
        <button onclick="window.location.href='/logout'">LOG OUT</button>
      </div>
    </div>
  </div>

</body>
</html>
