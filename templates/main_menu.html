<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Main Menu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}" />
</head>
<body class="menu-page">

  <div class="menu-container">
    <div class="top-bar">
      <div class="operator-bar">
        <img src="{{ url_for('static', filename='images/Shadows.gif') }}" class="logo" alt="Game Logo">
        <span class="operator-name">Operator: {{ username }}</span>
      </div>
      <div class="version">v0.1</div>
    </div>

    <div class="menu-content">
      <div class="leaderboard">
        <h2>LEADERBOARD</h2>
        <ul>
          <li>#1 PlayerX - 1200</li>
          <li>#2 ZombieSlayer - 980</li>
          <li>#3 Survivor99 - 870</li>
          <li>#4 DeadShot - 820</li>
          <li>#5 NightRun - 760</li>
        </ul>
      </div>

      <div class="menu-buttons">
  <a href="{{ url_for('show_play') }}"><button class="play-btn" type="button">PLAY GAME</button></a>
  <button type="button">SETTINGS</button>
  <a href="{{ url_for('show_achievements') }}"><button type="button">ACHIEVEMENTS</button></a>
  <a href="{{ url_for('logout') }}"><button type="button">LOG OUT</button></a>
</div>
    </div>
  </div>

</body>
</html>
