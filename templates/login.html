<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="login.pageTitle">Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}" />
</head>
<body class="auth-page login-page">

  <div class="login-container">
    <div class="route-zero-brand auth-route-zero-brand">
      <img
        src="{{ url_for('static', filename='images/icons/game_logo.svg') }}"
        class="game-logo auth-game-logo"
        alt=""
        aria-hidden="true"
      >
      <span class="route-zero-wordmark">ROUTE ZERO</span>
    </div>
    <h1>Welcome, Survivor</h1>
    <p class="subtitle">Access the safe zone</p>

    {% if error %}
      <p class="subtitle">{{ error }}</p>
    {% endif %}

    <form id="login-form" method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        name="username"
        required
        minlength="3"
        maxlength="80"
        autocomplete="username"
      />

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        required
        minlength="6"
        maxlength="255"
        autocomplete="current-password"
      />

      <button type="submit" class="login-btn" data-i18n="login.submit">Log In</button>
    </form>

    <div class="secondary-buttons">
      <button type="button" class="signup-btn" onclick="window.location.href='/register'" data-i18n="login.signup">
        New User Sign Up
      </button>

      <form method="POST" action="/guest-login" class="guest-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="guest-btn">Guest Login</button>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/register.js') }}" defer></script>
  <script type="module" src="{{ url_for('static', filename='js/translation.js') }}"></script>
</body>
</html>
