<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../static/css/login.css" />
</head>
<body>

  <div class="login-container">
    <h1>Welcome, Survivor</h1>
    <p class="subtitle">Access the safe zone</p>

    {% if error %}
      <p class="subtitle">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" />

      <button type="submit" class="login-btn">Log In</button>

      <div class="secondary-buttons">
        <button type="button" class="signup-btn" onclick="window.location.href='/register'">
          New User Sign Up
        </button>
        <button type="button" class="guest-btn">Guest Login</button>
      </div>
    </form>
  </div>

</body>
</html>
