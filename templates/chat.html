<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat with {{ friend.display_name or friend.username }}</title>

  <!-- Google font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

  <!-- Global CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}" />
</head>
<body
  class="play-page chat-page"
  data-current-user-id="{{ current_user }}"
  data-friend-id="{{ friend.id }}"
  data-friend-username="{{ friend.username }}"
>
  <div class="screen-wrap">
    <section class="panel active chat-panel">
      <div class="chat-topbar">
        <a href="{{ url_for('show_friends') }}" class="back-arrow">←</a>

        <div class="chat-heading">
          <h1 class="chat-header">Chat with {{ friend.display_name or friend.username }}</h1>
          <p class="chat-status" data-chat-status>Connecting live chat...</p>
          <p class="flash-message chat-alert" data-chat-alert hidden></p>
        </div>
      </div>

      <div class="chat-container">
        <div class="chat-messages" data-chat-messages></div>

        <!-- Chat Input -->
        <form method="POST" class="chat-form" data-chat-form>
          <input
            type="text"
            name="message"
            placeholder="Type a message..."
            required
            class="input-text"
            data-chat-input
          >
          <input type="hidden" name="ciphertext" data-chat-ciphertext>
          <input type="hidden" name="nonce" data-chat-nonce>
          <input type="hidden" name="sender_public_key" data-chat-sender-public-key>
          <input type="hidden" name="sender_key_id" data-chat-sender-key-id>
          <input type="hidden" name="recipient_public_key" data-chat-recipient-public-key>
          <input type="hidden" name="recipient_key_id" data-chat-recipient-key-id>
          <input type="hidden" name="encryption_version" value="1">
          <button type="submit" class="primary-btn" data-chat-submit>Send</button>
        </form>
      </div>
    </section>
  </div>
  <script type="application/json" data-chat-history>{{ chat_messages | tojson }}</script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
    integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
    crossorigin="anonymous"
  ></script>
  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
